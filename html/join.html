<!DOCTYPE html>
<!--
  join.html  —  참가 등록 화면 (★ 진행측 노트북용)

  참가자 휴대폰이 아니라 입구의 진행측 노트북에서 여는 화면이다.
  참가자가 도착하면 진행측이 팀과 이름을 적고,
  PIN 네 자리는 참가자 본인이 직접 눌러 넣는다.

  여기서 하는 일
    1. 팀을 고른다  (정원이 찬 팀은 고를 수 없다)
    2. 이름을 적는다
    3. 참가자가 PIN 4자리를 두 번 눌러 넣는다 (오타를 거르기 위해)
    4. 등록 버튼을 누르면 저장되고, 화면은 비워져 다음 사람을 받는다

  참가자는 이후 자기 휴대폰에서 play.html 에 들어가
  팀 + 이름 + PIN 으로 로그인한다.

  ../ 는 "한 단계 위 폴더"라는 뜻이다.
  이 파일은 html 폴더 안에 있으므로, css 폴더로 가려면 한 단계 올라가야 한다.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>참가 등록 · 골든벨</title>
  <link rel="stylesheet" href="../css/style.css">
</head>

<body data-page="join">
  <div class="모바일">

    <header class="머리글">
      <a class="로고" href="../index.html">
        <span class="로고표">골든<br>벨</span>
        <span class="로고글">
          <strong>2026 한가위 골든벨</strong>
          <small>GOLDEN BELL SURVIVAL</small>
        </span>
      </a>
      <span class="표식">참가 등록</span>
    </header>

    <!-- 등록 데스크 배치.

         좁은 화면에서는 위아래로 쌓이고,
         노트북에서는 왼쪽에 안내와 팀 현황, 오른쪽에 입력칸이 나란히 선다.
         (실제 배치는 css/style.css 의 .등록판 이 정한다) -->
    <div class="등록판">

      <!-- 왼쪽: 무엇을 하는 화면인지 + 팀이 얼마나 찼는지 -->
      <section class="등록안내">
        <p class="눈썹">WELCOME</p>
        <h1>참가 등록</h1>
        <p class="안내">팀과 이름은 나중에 바꿀 수 없으니 정확히 입력해주세요.<br>
          PIN 네 자리는 <b>참가자 본인이 직접</b> 눌러주세요.</p>

        <!-- 팀별 등록 현황. js/app.js 가 등록할 때마다 새로 채운다.
             접수대에서 "몇 팀이 아직 비었나"를 바로 보고 안내할 수 있다. -->
        <h2 class="등록안내제목">팀별 등록 현황</h2>
        <div class="팀현황" id="팀현황"></div>
      </section>

      <!-- 오른쪽: 실제로 적는 칸 -->
      <section class="카드 등록칸">

      <div class="입력묶음">
        <!-- label 의 for 와 아래 칸의 id 를 같게 맞추면
             글씨를 눌러도 해당 칸이 선택된다 -->
        <label for="팀선택">팀 선택</label>
        <select id="팀선택">
          <!-- 팀 목록은 js/app.js 가 자동으로 채운다 -->
        </select>

        <label for="이름입력">이름</label>
        <input id="이름입력" maxlength="20" placeholder="예) 김철수" autocomplete="off">
        <!-- maxlength: 최대 글자 수 / placeholder: 비어 있을 때 흐리게 보이는 예시 -->

        <!-- PIN 칸 두 개.

             type="password" : 누른 숫자가 ●●●● 로 가려진다.
                               옆에 진행자와 다음 사람이 서 있으므로 가리는 게 맞다.
             inputmode="numeric" : 휴대폰에서 숫자 자판이 먼저 열린다.
             autocomplete="new-password" : 브라우저가 이전 사람의 PIN 을
                               자동으로 채워 넣지 못하게 막는다.
                               노트북 한 대로 80명을 등록하므로 이게 없으면 사고가 난다. -->
        <label for="PIN입력">PIN 4자리 (참가자 본인 입력)</label>
        <input id="PIN입력" type="password" inputmode="numeric" maxlength="4"
               placeholder="숫자 4자리" autocomplete="new-password">

        <label for="PIN확인">PIN 다시 입력</label>
        <input id="PIN확인" type="password" inputmode="numeric" maxlength="4"
               placeholder="한 번 더" autocomplete="new-password">

        <button class="주요버튼" id="참가버튼">등록하기</button>

        <!-- 오류 메시지가 표시될 자리. 처음엔 비어 있다. -->
        <p class="오류" id="알림"></p>

        <!-- 방금 등록한 사람을 알려주는 자리 (오류가 아니므로 초록색) -->
        <p class="생존" id="등록완료" style="margin:0;text-align:center"></p>
      </div>
      </section>

    </div>

  </div>

  <!-- 자바스크립트는 화면이 다 만들어진 뒤에 읽혀야 하므로 맨 아래에 둔다.
       store.js 를 먼저, app.js 를 나중에 불러야 한다.
       app.js 가 store.js 안의 함수를 쓰기 때문이다. -->
  <script src="../js/store.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
