<!DOCTYPE html>
<!--
  join.html  —  참가 등록 화면 (휴대폰용)

  여기서 하는 일
    1. 팀을 고른다  (정원이 찬 팀은 고를 수 없다)
    2. 이름을 적는다
    3. 참가 버튼을 누르면 등록되고 게임 화면으로 넘어간다

  ../ 는 "한 단계 위 폴더"라는 뜻이다.
  이 파일은 html 폴더 안에 있으므로, css 폴더로 가려면 한 단계 올라가야 한다.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>참가 등록 · 골든벨</title>
  <link rel="stylesheet" href="../css/style.css">
</head>

<body data-page="join">
  <div class="모바일">

    <header class="머리글">
      <a class="로고" href="../index.html">
        <span class="로고표">골든<br>벨</span>
        <span class="로고글">
          <strong>2026 한가위 골든벨</strong>
          <small>GOLDEN BELL SURVIVAL</small>
        </span>
      </a>
      <span class="표식">참가 등록</span>
    </header>

    <section class="카드">
      <p class="눈썹">WELCOME</p>
      <h1>참가하기</h1>
      <p class="안내">팀과 이름은 나중에 바꿀 수 없으니 정확히 입력해주세요.</p>

      <div class="입력묶음" style="margin-top:22px">
        <!-- label 의 for 와 아래 칸의 id 를 같게 맞추면
             글씨를 눌러도 해당 칸이 선택된다 -->
        <label for="팀선택">팀 선택</label>
        <select id="팀선택">
          <!-- 팀 목록은 js/app.js 가 자동으로 채운다 -->
        </select>

        <label for="이름입력">이름</label>
        <input id="이름입력" maxlength="20" placeholder="예) 김철수" autocomplete="off">
        <!-- maxlength: 최대 글자 수 / placeholder: 비어 있을 때 흐리게 보이는 예시 -->

        <button class="주요버튼" id="참가버튼">참가하기</button>

        <!-- 오류 메시지가 표시될 자리. 처음엔 비어 있다. -->
        <p class="오류" id="알림"></p>
      </div>
    </section>

  </div>

  <!-- 자바스크립트는 화면이 다 만들어진 뒤에 읽혀야 하므로 맨 아래에 둔다.
       store.js 를 먼저, app.js 를 나중에 불러야 한다.
       app.js 가 store.js 안의 함수를 쓰기 때문이다. -->
  <script src="../js/store.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
